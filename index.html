<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Rutina</title>
<meta name="theme-color" content="#2557d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
</head>
<body>
<style>
  /* Herramienta de registro: una columna, controles grandes para usar en el gimnasio */
  :root { --bg:#ffffff; --fg:#1b1d22; --mut:#62666f; --line:#dcdee3; --card:#f4f5f7; --acc:#2557d6; --onacc:#ffffff; --ok:#15803d; --warn:#a85a07; --bad:#b91c1c; --imgbg:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#131417; --fg:#e8e9ec; --mut:#9a9ea7; --line:#33363d; --card:#1d1f24; --acc:#7aa2ff; --onacc:#0d1220; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --imgbg:#ffffff; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#131417; --fg:#e8e9ec; --mut:#9a9ea7; --line:#33363d; --card:#1d1f24; --acc:#7aa2ff; --onacc:#0d1220; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --imgbg:#ffffff; color-scheme:dark; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom:calc(130px + env(safe-area-inset-bottom, 0px)); }
  /* Barra de pestañas abajo: la parte superior la ocupan los botones del visor de Claude */
  header { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); z-index:8; padding-bottom:env(safe-area-inset-bottom, 0px); }
  nav { display:flex; overflow-x:auto; gap:2px; padding-block:4px; padding-left:max(4px, env(safe-area-inset-left, 0px)); padding-right:max(4px, env(safe-area-inset-right, 0px)); max-width:820px; margin:0 auto; }
  nav button { flex:1 0 auto; background:none; border:0; color:var(--mut); padding:12px 4px; border-radius:6px; font-size:12.5px; white-space:nowrap; cursor:pointer; }
  nav button.on { color:var(--fg); background:var(--card); font-weight:600; }
  main { max-width:820px; margin:0 auto; padding-block:52px 12px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  h2 { font-size:18px; margin:16px 0 8px; text-wrap:balance; } h3 { font-size:15px; margin:12px 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; min-width:0; overflow-x:auto; }
  .mut { color:var(--mut); font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; max-width:100%; }
  input[type=number] { width:68px; font-variant-numeric:tabular-nums; }
  textarea { width:100%; min-height:50px; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button.b { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button.p, button.on { background:var(--acc); color:var(--onacc); border-color:var(--acc); }
  button.sm { padding:2px 8px; font-size:13px; }
  button.ok { border-color:var(--ok); color:var(--ok); }
  label.b { display:inline-block; border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  td, th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  .set { display:grid; grid-template-columns:28px 1fr 1fr 1fr 40px; gap:6px; align-items:center; margin:4px 0; }
  .set input { width:100%; }
  .set.done input { border-color:var(--ok); }
  .hecho { opacity:.6; }
  .sug { font-size:13px; color:var(--acc); }
  .warn { color:var(--warn); font-size:13px; }
  .bar { height:10px; background:var(--line); border-radius:5px; position:relative; overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--acc); }
  .bar.ok i { background:var(--ok); } .bar.lo i { background:var(--warn); } .bar.hi i { background:var(--bad); }
  #timer { position:fixed; left:0; right:0; bottom:calc(50px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding-top:10px; padding-bottom:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:none; align-items:center; gap:12px; justify-content:center; font-size:18px; z-index:9; font-variant-numeric:tabular-nums; }
  #timer button { background:none; border:1px solid var(--bg); color:var(--bg); border-radius:6px; padding:4px 10px; }
  #estado { position:fixed; left:max(16px, env(safe-area-inset-left, 0px)); right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(110px + env(safe-area-inset-bottom, 0px)); max-width:560px; margin:0 auto; background:var(--fg); color:var(--bg); border-radius:8px; padding:10px 14px; z-index:10; font-size:14px; }
  details summary { cursor:pointer; }
  .anim { position:relative; width:100%; max-width:360px; aspect-ratio:3/2; margin:8px 0; border-radius:8px; overflow:hidden; background:var(--imgbg); }
  .anim img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .anim img:nth-child(2) { animation:frame 1.6s steps(1) infinite; }
  @keyframes frame { 0% { opacity:0; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .anim img:nth-child(2) { animation-duration:4s; } }
  a { color:var(--acc); }
  .tag { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:10px; padding:0 6px; margin:1px; color:var(--mut); }
  svg text { fill:var(--mut); font-size:11px; }
  .emo button { font-size:20px; padding:2px 6px; }
  .checks { display:grid; gap:6px; margin-top:8px; }
  button.chk { text-align:left; padding:10px 12px; font-size:15px; }
  button.chk.ok { background:var(--card); }
</style>
<header><nav id="nav"></nav></header>
<main id="main"><p class="mut">Cargando…</p></main>
<div id="estado" role="status" hidden></div>
<div id="timer"><span>Descanso <b id="tleft">0:00</b></span><button data-act="t+">+30 s</button><button data-act="tstop">✕</button></div>
<script src="datos.js"></script>
<script src="app.js"></script>
<style>
  /* Fuera de Claude no hay botones del visor arriba: solo el margen de la muesca */
  main { padding-block: calc(12px + env(safe-area-inset-top, 0px)) 12px; }
</style>
<script>
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
